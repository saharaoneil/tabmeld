<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h2>📑 TabMeld</h2>
  </header>
  
  <div class="container">
    <div class="mode-selector">
      <label>Synthesis Mode</label>
      <select id="mode-select">
        <option value="research">📋 Research Memo</option>
        <option value="competitive">🎯 Competitive Analysis</option>
        <option value="meeting">💼 Meeting Prep</option>
      </select>
    </div>
    
    <p id="status">Loading tabs...</p>
    <div id="tab-list"></div>
    
    <button id="synthesize-btn">Synthesize Selected Tabs</button>
    
    <div id="result"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
