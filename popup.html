<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 450px; padding: 15px; margin: 0; }
    h2 { margin: 0 0 15px 0; font-size: 18px; }
    #tab-list { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; }
    .tab-item { padding: 8px; margin: 5px 0; border: 1px solid #e0e0e0; border-radius: 4px; }
    .tab-item input { margin-right: 8px; }
    .tab-title { font-weight: bold; font-size: 12px; }
    .tab-text { font-size: 11px; color: #666; margin: 3px 0; max-height: 60px; overflow: hidden; }
    button { padding: 10px 15px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0052a3; }
    #status { font-size: 12px; color: #999; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>📑 TabMeld</h2>
  <p id="status">Loading tabs...</p>
  
  <div id="tab-list"></div>
  
  <button id="extract-btn">Extract Selected Tabs</button>
  
  <script src="popup.js"></script>
</body>
</html>
